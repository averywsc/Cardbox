/* Layout: a study desk. A slim bar on top holds the name, two tabs (Decks, Stats) and the backup button. Decks are
   index cards with a coloured top rule. The box on the home page is a wooden drawer of five compartments, from
   cards you have not seen to cards you will not see for months, and every rating moves a card one way along it.

  --bg: #e3e8ee; --bg2: #d6dde6; --surface: #f8fafc; --card: #fffefa; --ink: #152038; --muted: #56627b; --line: #c4cdd9;

  color: var(--ink); font: 400 16px/1.5 var(--body); padding-block: 0 72px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));

/* ---------- bar ---------- */

.btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 0 var(--ink); } .btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
.btn:disabled { opacity: 0.45; cursor: default; box-shadow: none; }

.eyebrow { font: 500 0.72rem/1 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }

.due .row { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 5px 10px; border-radius: 999px; font: 500 0.78rem/1 var(--mono); background: color-mix(in srgb, var(--ink) 8%, transparent); }
.pill i { width: 9px; height: 9px; border-radius: 50%; } .pill .n { background: var(--easy); } .pill .l { background: var(--hard); } .pill .r { background: var(--good); }
.streak { font-size: 0.9rem; color: var(--muted); }
.streak b { color: var(--ink); font-family: var(--head); font-size: 1.1rem; }
.tray { position: relative; }
.tray svg { width: 100%; height: auto; display: block; }
.tray .cap { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; font: 500 0.7rem/1.3 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.tray .cap span { flex: 1; text-align: center; }
.tray .cap b { display: block; color: var(--ink); font: 800 1.15rem/1.1 var(--head); letter-spacing: 0; }
.intro { display: flex; gap: 14px; align-items: flex-start; margin-top: 18px; padding: 14px 16px; border-radius: 12px; background: color-mix(in srgb, var(--accent) 24%, var(--surface)); border: 1.5px solid color-mix(in srgb, var(--accent) 60%, var(--line)); }
.intro p { flex: 1; font-size: 0.95rem; } .intro b { font-family: var(--head); }
.sechead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 30px 0 14px; }
.sechead h2 { font: 800 1.5rem/1 var(--head); }
.decks { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 18px; }
.deck { position: relative; display: grid; gap: 12px; align-content: start; padding: 20px 18px 16px; background: var(--card); border: 1.5px solid var(--line); border-top: 6px solid var(--dc, var(--d0)); border-radius: 4px 4px 12px 12px; min-width: 0;
  background-image: repeating-linear-gradient(transparent 0 27px, color-mix(in srgb, var(--rule) 40%, transparent) 27px 28px); box-shadow: 0 8px 12px -10px color-mix(in srgb, var(--ink) 55%, transparent); transition: transform 0.35s var(--ease), box-shadow 0.35s var(--ease); }

.newdeck:hover { border-color: var(--ink); color: var(--ink); }

.inline { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.preview { padding: 12px 14px; border-radius: 6px; background: var(--card); border: 1.5px dashed var(--line); font: 400 1.05rem/1.5 var(--face); min-height: 3em; overflow-wrap: anywhere; }

.list { display: grid; gap: 0; }

.crow.edit { display: block; }
.empty { padding: 28px 12px; text-align: center; color: var(--muted); }

.studytop { display: grid; gap: 10px; padding: 8px 0 16px; }

.track { height: 8px; border-radius: 5px; background: color-mix(in srgb, var(--ink) 12%, transparent); overflow: hidden; }
.track i { display: block; height: 100%; width: 0; background: var(--dc, var(--good)); border-radius: 5px; transition: width 0.5s var(--ease); }
.stage { perspective: 1400px; }
.icard { position: relative; min-height: min(52vh, 380px); padding: 30px 28px 26px; border-radius: 6px 6px 14px 14px; background: var(--card); border: 1.5px solid var(--line); border-top: 0;
  background-image: repeating-linear-gradient(transparent 0 33px, color-mix(in srgb, var(--rule) 70%, transparent) 33px 34px); background-position: 0 58px;
  box-shadow: 0 2px 0 color-mix(in srgb, var(--ink) 14%, transparent), 0 26px 30px -16px color-mix(in srgb, var(--ink) 55%, transparent); display: grid; align-content: center; gap: 18px; }
.icard::before { content: ""; position: absolute; left: -1.5px; right: -1.5px; top: 0; height: 36px; border-radius: 6px 6px 0 0; background: var(--red); opacity: 0.92; }
.icard::after { content: ""; position: absolute; left: 20px; top: 12px; width: 12px; height: 12px; border-radius: 50%; background: var(--bg); box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.45); }
.icard .tag { position: absolute; right: 16px; top: 10px; font: 500 0.68rem/1 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: #fff; opacity: 0.92; }
.icard .face { margin-top: 22px; font: 400 clamp(1.3rem, 3.6vw, 1.8rem)/1.45 var(--face); text-align: center; overflow-wrap: anywhere; }
.icard .face.small { font-size: clamp(1rem, 2.6vw, 1.2rem); color: var(--muted); }
.icard .div { height: 0; border-top: 2.5px dashed var(--red); opacity: 0.55; margin: 0 8%; }
.icard .ans { font: 600 clamp(1.3rem, 3.6vw, 1.8rem)/1.45 var(--face); text-align: center; overflow-wrap: anywhere; }
.reveal { display: flex; justify-content: center; margin-top: 18px; }
.reveal .btn { min-width: 220px; padding: 15px 22px; font-size: 1.05rem; }
.grades { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 18px; }
.gb { display: grid; gap: 5px; justify-items: center; padding: 12px 6px 10px; border-radius: 11px; border: 2px solid var(--gc); background: color-mix(in srgb, var(--gc) 12%, var(--surface)); color: var(--ink); box-shadow: 0 3px 0 var(--gc); transition: transform 0.18s var(--ease), box-shadow 0.18s var(--ease); }
.gb:hover { transform: translateY(-2px); box-shadow: 0 5px 0 var(--gc); } .gb:active { transform: translateY(3px); box-shadow: 0 0 0 var(--gc); }
.gb b { font: 800 1.05rem/1 var(--head); } .gb span { font: 500 0.78rem/1 var(--mono); color: var(--muted); } .gb kbd { font: 500 0.66rem/1 var(--mono); color: var(--muted); opacity: 0.8; }
.keys { margin-top: 14px; text-align: center; font-size: 0.8rem; color: var(--muted); }
.keys kbd { font: 500 0.72rem var(--mono); padding: 2px 6px; border-radius: 4px; border: 1.5px solid var(--line); }
.wait { display: grid; gap: 12px; justify-items: center; text-align: center; padding: 40px 20px; }
.wait .big { font: 800 3rem/1 var(--head); font-variant-numeric: tabular-nums; }

.sum { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.sum div { min-width: 96px; padding: 12px 14px; border-radius: 11px; border: 1.5px solid var(--line); background: var(--surface); display: grid; gap: 4px; }
.sum b { font: 800 1.7rem/1 var(--head); font-variant-numeric: tabular-nums; } .sum span { font: 500 0.68rem/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.stamp { display: inline-block; padding: 6px 16px; border: 3px solid var(--good); color: var(--good); border-radius: 6px; font: 800 1.1rem/1 var(--head); letter-spacing: 0.14em; text-transform: uppercase; transform: rotate(-4deg); }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-top: 8px; }

/* ---------- dialog, toast ---------- */

@media (max-width: 860px) { .today, .cols { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 520px) { .grades { gap: 6px; } .gb { padding: 10px 2px 8px; } .gb b { font-size: 0.95rem; } .icard { padding: 28px 18px 22px; } .bar .sp { display: none; } .chip { margin-left: auto; } .dlg .two { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; } }

<script>
// Cardbox logic. No DOM in here.
// A card moves through three states: new (never seen), learning (short steps in minutes), review (spaced in days).
// Rating a card Again / Hard / Good / Easy decides where it goes next.

const DAY = 86400000, MIN = 60000;
const STEPS = [1, 10];                 // learning steps, minutes
const LEARN_AHEAD = 20 * MIN;          // a learning card this close to due can be shown now
const MAX_IV = 3650;

function dayNum(ms) { const d = new Date(ms); return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / DAY); }
function dayLabel(n) { return new Date(n * DAY).toISOString().slice(0, 10); }
function uid(p) { return (p || 'x') + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3); }
function hashStr(s) { let h = 2166136261 >>> 0; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

function newCard(front, back, kind, now) {
  return { id: uid('c'), k: kind === 'c' ? 'c' : 'b', f: String(front || ''), b: String(back || ''), s: 0, st: 0, iv: 0, ez: 2.5, dm: 0, dd: 0, lp: 0, rp: 0, rl: false, ca: now || Date.now(), lr: 0 };
}

// Spread long intervals a little so cards added together do not all return on one day.
function fuzz(card, iv) {
  if (iv < 7) return iv;
  const span = Math.max(1, Math.round(iv * 0.05)), h = hashStr(card.id + ':' + card.rp);
  return iv - span + (h % (2 * span + 1));
}

// Pure: returns the card as it will be after a rating (1 Again, 2 Hard, 3 Good, 4 Easy).
function schedule(card, grade, now) {
  const c = Object.assign({}, card), today = dayNum(now);
  c.rp = card.rp + 1; c.lr = now;
  const graduate = (iv) => { c.s = 2; c.st = 0; c.iv = Math.min(MAX_IV, Math.max(1, iv)); c.dd = today + c.iv; c.dm = 0; c.rl = false; };
  const learn = (step, mins) => { c.s = 1; c.st = step; c.dm = now + mins * MIN; c.dd = 0; };
  if (card.s === 0 || card.s === 1) {
    const st = card.s === 0 ? 0 : card.st;
    if (grade === 1) learn(0, STEPS[0]);
    else if (grade === 2) learn(st, st === 0 ? Math.round((STEPS[0] + STEPS[1]) / 2) : STEPS[st]);
    else if (grade === 3) { if (st + 1 < STEPS.length) learn(st + 1, STEPS[st + 1]); else graduate(card.rl ? card.iv : 1); }
    else graduate(card.rl ? card.iv + 1 : 4);
    return c;

  $('#ov').addEventListener('click', function (e) { if (e.target === $('#ov')) closeDialog(); });
  function backupDialog(targetDeck) {
    var opts = S.decks.map(function (d) { return '<option value="' + d.id + '"' + (d.id === targetDeck ? ' selected' : '') + '>' + esc(d.name) + '</option>'; }).join('');
    openDialog('<h2>Backup &amp; import</h2><h3>Back up</h3><p class="hint">Download everything as one file. Keep it somewhere safe, or use it to move your decks to another browser.</p><div class="inline"><button type="button" class="btn hi" data-act="dlbackup">Download backup</button></div><div id="outbox"></div>' +
      '<h3>Import cards</h3><p class="hint">Paste lines of <code>front, back</code> separated by a tab or comma. Quizlet exports and spreadsheets work. A backup file works too.</p><textarea class="txt" id="imp" rows="5" placeholder="hola&#9;hello&#10;adiós&#9;goodbye" style="font-family:var(--mono);font-size:0.9rem"></textarea><div class="inline"><label class="btn sm quiet" for="impf" style="cursor:pointer">Choose a file<input type="file" id="impf" accept=".csv,.tsv,.txt,.json" hidden></label><span class="hint" id="impInfo"></span></div>' +
      '<div class="two"><label class="lab" for="impd">Add to<select class="sel" id="impd">' + opts + '<option value="new">New deck…</option></select></label><label class="lab" for="impn">New deck name<input class="inp" id="impn" placeholder="Imported cards"></label></div><div class="inline"><button type="button" class="btn hi" data-act="doimport" id="impGo" disabled>Import</button></div>' +
      '<h3>Daily limits</h3><div class="two"><label class="lab" for="limn">New cards a day<input class="inp" id="limn" type="number" min="0" max="999" value="' + S.meta.set.n + '"></label><label class="lab" for="limr">Reviews a day<input class="inp" id="limr" type="number" min="0" max="9999" value="' + S.meta.set.r + '"></label></div>' +
      '<h3>Everything else</h3><div class="inline"><button type="button" class="btn sm danger" data-act="wipe">Delete all my data</button><button type="button" class="btn quiet" data-act="closedlg" style="margin-left:auto">Close</button></div>');
  }
  function backupJson() { return JSON.stringify({ app: 'cardbox', v: 1, saved: new Date().toISOString(), decks: S.decks, meta: S.meta }); }
  async function saveFile(name, text) {
    try {
      var dl = window.claude && claude.use ? await claude.use('downloads') : null;
      if (dl && dl.save) { await dl.save({ filename: name, data: text }); toast('Saved ' + name); return; }
    } catch (e) { if (e && e.code && e.code !== 'not_granted') { /* fall through to copy box */ } else if (e && e.code === 'not_granted') { toast('Not saved'); return; } }
    var box = $('#outbox') || $('#dlg'); var id = 'cp' + Date.now();
    box.insertAdjacentHTML('beforeend', '<div class="form" style="margin-top:10px"><p class="hint">Downloads are not available here. Copy this text and keep it in a file called ' + esc(name) + '.</p><textarea class="txt" id="' + id + '" rows="5" readonly style="font-family:var(--mono);font-size:0.8rem"></textarea><div class="inline"><button type="button" class="btn sm" data-act="copybox" data-t="' + id + '">Copy</button></div></div>');
    $('#' + id).value = text;
  }
  var impParsed = null;
  function parseInto() {
    var t = $('#imp').value, info = $('#impInfo'), go = $('#impGo'); impParsed = parseImport(t);
    if (!t.trim()) { info.textContent = ''; go.disabled = true; return; }
    if (impParsed.kind === 'backup') { info.textContent = 'Backup file: ' + plural(impParsed.data.decks.length, 'deck', 'decks') + '. Importing adds or updates them.'; go.disabled = false; go.textContent = 'Restore'; return; }
    go.textContent = 'Import'; info.textContent = plural(impParsed.cards.length, 'card', 'cards') + ' found' + (impParsed.skipped ? ', ' + impParsed.skipped + ' skipped' : ''); go.disabled = !impParsed.cards.length;
  }

  /* ---------- actions ---------- */
  function addDeck(name) { var d = { id: uid('d'), name: name || 'New deck', hue: S.decks.length % 6, ua: Date.now(), cards: [] }; S.decks.push(d); touchDeck(d); return d; }
  document.addEventListener('click', function (e) {
    var a = e.target.closest('[data-act]'); if (!a) return;
    var act = a.getAttribute('data-act'), id = a.getAttribute('data-id'), d = id ? deckById(id) : null;
    switch (act) {
      case 'go': go(a.getAttribute('data-to')); break;
      case 'open': query = ''; shown = 40; go('deck-' + id); break;
      case 'study': go('study-' + id); break;
      case 'exit': go('decks'); break;
      case 'hideintro': S.meta.seen = true; touchMeta(); var i = $('#intro'); if (i) i.remove(); break;
      case 'newdeck':
        a.outerHTML = '<form class="deck" id="ndForm" style="--dc:var(--d' + (S.decks.length % 6) + ')"><label class="lab" for="ndn">Deck name<input class="inp" id="ndn" maxlength="60" placeholder="Biology, Spanish verbs…"></label><div class="acts inline"><button class="btn sm hi" type="submit">Create</button><button type="button" class="btn sm quiet" data-act="go" data-to="decks">Cancel</button></div></form>'; var nn = $('#ndn'); if (nn) nn.focus(); break;
      case 'rename': if (d) { var h1 = $('.deckhead h1'); h1.outerHTML = '<form id="rnForm" data-id="' + d.id + '" class="inline" style="flex:1 1 240px"><input class="inp" id="rnn" maxlength="60" value="' + esc(d.name) + '" aria-label="Deck name" style="font:800 1.4rem var(--head);max-width:420px"><button class="btn sm hi" type="submit">Save</button></form>'; var r = $('#rnn'); if (r) { r.focus(); r.select(); } } break;
      case 'deldeck': if (d) { if (a.getAttribute('data-sure') !== '1') { a.setAttribute('data-sure', '1'); a.textContent = 'Really delete ' + d.cards.length + ' cards?'; setTimeout(function () { if (a.isConnected) { a.removeAttribute('data-sure'); a.textContent = 'Delete deck'; } }, 3500); } else { S.decks = S.decks.filter(function (x) { return x !== d; }); S.meta.del[d.id] = Date.now(); delete R.dirty[d.id]; if (R.coll) R.dels[d.id] = 1; touchMeta(); lsSave(); kick(); toast('Deck deleted'); go('decks'); } } break;
      case 'kind': addKind = a.getAttribute('data-k'); var dk = deckById(route.id); $('#view').innerHTML = deckHtml(dk); updatePreview(); break;
      case 'more': shown += 40; var dm = deckById(route.id); $('#clist').innerHTML = listHtml(dm); break;
      case 'editcard': editCard(a.getAttribute('data-id')); break;
      case 'delcard': { var dd = deckById(route.id), cid = a.getAttribute('data-id'); if (a.getAttribute('data-sure') !== '1') { a.setAttribute('data-sure', '1'); a.textContent = 'Sure?'; setTimeout(function () { if (a.isConnected) { a.removeAttribute('data-sure'); a.textContent = 'Delete'; } }, 3000); } else { dd.cards = dd.cards.filter(function (c) { return c.id !== cid; }); touchDeck(dd); var row = a.closest('.crow'); var an = anim(row, [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateX(30px)' }], { duration: 240, fill: 'forwards' }); setTimeout(function () { $('#clist').innerHTML = listHtml(dd); var hs = document.querySelectorAll('section[aria-label="Cards"] h2'); if (hs[0]) hs[0].textContent = plural(dd.cards.length, 'card', 'cards'); }, an ? 240 : 0); } } break;
      case 'importto': backupDialog(id); break;
      case 'backup': backupDialog(route.name === 'deck' ? route.id : ''); break;
      case 'closedlg': closeDialog(); break;
      case 'dlbackup': saveFile('cardbox-backup-' + dayLabel(dayNum(Date.now())) + '.json', backupJson()); break;
      case 'exportdeck': if (d) saveFile(d.name.replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-').toLowerCase() + '.tsv', toTSV(d)); break;
      case 'copybox': { var ta = document.getElementById(a.getAttribute('data-t')); ta.select(); var ok = false; try { navigator.clipboard.writeText(ta.value).then(function () { toast('Copied'); }, function () { try { document.execCommand('copy'); toast('Copied'); } catch (x) {} }); ok = true; } catch (x) {} if (!ok) { try { document.execCommand('copy'); toast('Copied'); } catch (y) {} } } break;
      case 'doimport': doImport(); break;
      case 'wipe': if (a.getAttribute('data-sure') !== '1') { a.setAttribute('data-sure', '1'); a.textContent = 'Really delete everything?'; } else { var now = Date.now(); S.decks.forEach(function (x) { S.meta.del[x.id] = now; if (R.coll) R.dels[x.id] = 1; }); S.decks = []; S.meta.daily = {}; touchMeta(); lsSave(); kick(); closeDialog(); toast('Everything deleted'); go('decks'); } break;
      case 'show': reveal(); break;
      case 'grade': grade(+a.getAttribute('data-g')); break;
      case 'early': if (Q) { var soonId = Q.learn.slice().sort(function (x, y) { return Q.map[x].c.dm - Q.map[y].c.dm; })[0]; if (soonId) { Q.cur = soonId; Q.waitTo = 0; drawStudy(true); } } break;
      case 'morenew': Q.extraNew += 10; startStudy(Q.scope, Q.extraNew); break;
    }
  });
  function editCard(cid) {
    var d = deckById(route.id), c = d.cards.filter(function (x) { return x.id === cid; })[0], row = $('.crow[data-id="' + cid + '"]'); if (!c || !row) return;
    row.className = 'crow edit';
    row.innerHTML = '<form class="form" data-id="' + cid + '" id="edForm"><label class="lab" for="ef">' + (c.k === 'c' ? 'Sentence' : 'Front') + '<textarea class="txt" id="ef" rows="3">' + esc(c.f) + '</textarea></label>' + (c.k === 'b' ? '<label class="lab" for="eb">Back<textarea class="txt" id="eb" rows="3">' + esc(c.b) + '</textarea></label>' : '') + '<div class="inline"><button type="submit" class="btn sm hi">Save</button><button type="button" class="btn sm quiet" data-act="canceledit">Cancel</button></div></form>';
    $('#ef').focus();
  }
  document.addEventListener('click', function (e) { if (e.target.closest('[data-act="canceledit"]')) { var d = deckById(route.id); $('#clist').innerHTML = listHtml(d); } });
  document.addEventListener('submit', function (e) {
    var f = e.target; e.preventDefault();
    if (f.id === 'ndForm') { var nm = $('#ndn').value.trim(); if (!nm) { $('#ndn').focus(); return; } var d = addDeck(nm); go('deck-' + d.id); }
    else if (f.id === 'rnForm') { var dk = deckById(f.getAttribute('data-id')), v = $('#rnn').value.trim(); if (dk && v) { dk.name = v; touchDeck(dk); } render(); }
    else if (f.id === 'addForm') {
      var d2 = deckById(route.id), fr = $('#nf').value.trim(), bk = $('#nb') ? $('#nb').value.trim() : '';
      if (!fr) { $('#nf').focus(); return; }
      if (addKind === 'c' && !clozeCount(fr)) { toast('Put {{double braces}} around the words to hide'); $('#nf').focus(); return; }
      if (addKind === 'b' && !bk) { toast('Add the back of the card'); $('#nb').focus(); return; }
      var now = Date.now(), made = [newCard(fr, bk, addKind, now)];
      if (addKind === 'b' && $('#rev') && $('#rev').checked) made.push(newCard(bk, fr, 'b', now + 1));
      made.forEach(function (c) { d2.cards.push(c); }); touchDeck(d2);
      $('#nf').value = ''; if ($('#nb')) $('#nb').value = ''; updatePreview(); $('#clist').innerHTML = listHtml(d2);
      var hs = document.querySelectorAll('section[aria-label="Cards"] h2'); if (hs[0]) hs[0].textContent = plural(d2.cards.length, 'card', 'cards');
      var first = $('#clist .crow'); if (first) anim(first, [{ background: 'color-mix(in srgb, var(--accent) 50%, transparent)' }, { background: 'transparent' }], { duration: 900, fill: 'none' });
      toast(made.length > 1 ? 'Added 2 cards' : 'Card added'); $('#nf').focus();
    } else if (f.id === 'edForm') {
      var d3 = deckById(route.id), c = d3.cards.filter(function (x) { return x.id === f.getAttribute('data-id'); })[0], nf = $('#ef').value.trim(), nb = $('#eb') ? $('#eb').value.trim() : c.b;
      if (!nf || (c.k === 'b' && !nb)) { toast('Both sides need some text'); return; }
      if (c.k === 'c' && !clozeCount(nf)) { toast('Keep at least one {{blank}}'); return; }
      c.f = nf; c.b = nb; touchDeck(d3); $('#clist').innerHTML = listHtml(d3); toast('Saved');
    }
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'nf' || e.target.id === 'nb') updatePreview();
    else if (e.target.id === 'qs') { query = e.target.value; shown = 40; var d = deckById(route.id); $('#clist').innerHTML = listHtml(d); }
    else if (e.target.id === 'imp') parseInto();
    else if (e.target.id === 'limn' || e.target.id === 'limr') { S.meta.set.n = clampN($('#limn').value, S.meta.set.n); S.meta.set.r = clampN($('#limr').value, S.meta.set.r); touchMeta(); }
  });
  document.addEventListener('change', function (e) {
    if (e.target.id === 'impf' && e.target.files && e.target.files[0]) { var fr = new FileReader(); fr.onload = function () { $('#imp').value = String(fr.result || ''); parseInto(); }; fr.readAsText(e.target.files[0]); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !$('#ov').hidden) { closeDialog(); return; }
    var tag = (e.target.tagName || '').toLowerCase();
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && e.target.closest && e.target.closest('#addForm')) { e.preventDefault(); $('#addForm').requestSubmit(); return; }
    if (route.name !== 'study' || !Q || tag === 'input' || tag === 'textarea' || !$('#ov').hidden || e.ctrlKey || e.metaKey || e.altKey) return;
    if (!Q.cur) return;
    if (!Q.shown && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); reveal(); }
    else if (Q.shown && '1234'.indexOf(e.key) >= 0 && e.key.length === 1) { e.preventDefault(); grade(+e.key); }
    else if (Q.shown && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); grade(3); }
    else if (e.key === 'u' || e.key === 'U') undo();
    else if (e.key === 'Escape') go('decks');
  });
  function doImport() {
    if (!impParsed) return;
    if (impParsed.kind === 'backup') {
      var inc = fixState({ decks: impParsed.data.decks, meta: impParsed.data.meta }), n = 0;
      inc.decks.forEach(function (rd) { var ld = deckById(rd.id); if (!ld) { S.decks.push(rd); n++; } else if (rd.ua >= ld.ua) { S.decks[S.decks.indexOf(ld)] = rd; n++; } delete S.meta.del[rd.id]; rd.ua = Math.max(rd.ua, Date.now()); R.dirty[rd.id] = 1; });
      Object.keys(inc.meta.daily).forEach(function (k) { var a = S.meta.daily[k], b = inc.meta.daily[k]; if (!a || b[0] > a[0]) S.meta.daily[k] = b; });
      touchMeta(); lsSave(); kick(); closeDialog(); toast('Restored ' + plural(n, 'deck', 'decks')); render(); return;
    }
    var tgt = $('#impd').value, d = tgt === 'new' || !deckById(tgt) ? addDeck($('#impn').value.trim() || 'Imported cards') : deckById(tgt), now = Date.now();
    impParsed.cards.forEach(function (c, i) { d.cards.push(newCard(c.f, c.b, c.k, now + i)); });
    touchDeck(d); closeDialog(); toast('Imported ' + plural(impParsed.cards.length, 'card', 'cards')); go('deck-' + d.id);
  }

  /* ---------- start ---------- */
  async function boot() {
    var local = lsLoad(); setSync('local'); $('#syncTxt').textContent = 'Opening';
    if (local) S = local;
    loaded = true; if (local) render(); else $('#view').innerHTML = '<div class="empty"><b>Opening your box…</b></div>';
    var changed = await connect();
    if (!local && !S.decks.length && !S.meta.seen && !Object.keys(S.meta.del).length) { var sd = sampleDeck(); S.decks.push(sd); R.dirty[sd.id] = 1; lsSave(); if (R.coll) kick(); changed = true; }
    if (R.state === 'local') setSync('local');
    if (changed || !local) { if (route.name !== 'study') render(); }
  }
  boot();
  window.addEventListener('pagehide', function () { lsSave(); });
  setInterval(function () { if (route.name === 'decks' && !Q) { /* keep due counts fresh when the date rolls over */ var k = dayNum(Date.now()); if (boot.k && boot.k !== k && $('#ov').hidden) render(); boot.k = k; } }, 30000);
})();
</script>

</body></html>
